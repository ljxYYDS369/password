<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0E1A">
<title>账号密码管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  /* ============ Tech HUD Design Tokens ============ */
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);

    /* 霓虹色系 */
    --neon-cyan: #00F0FF;
    --neon-cyan-soft: rgba(0, 240, 255, 0.15);
    --neon-magenta: #FF2E97;
    --neon-purple: #B026FF;
    --neon-green: #39FF14;
    --neon-red: #FF3B5C;

    /* 深色背景层级 */
    --dark-0: #050810;       /* 最深 */
    --dark-1: #0A0E1A;       /* 主深色 */
    --dark-2: #0F1424;       /* 卡片深色 */
    --dark-3: #1A1F35;       /* 浅深色 */

    /* 浅色列表区 */
    --light-bg: #0A0E1A;
    --light-card: #131A2E;
    --light-card-hover: #1A2338;

    /* 文字 */
    --text-bright: #FFFFFF;
    --text-cyan: #00F0FF;
    --text-dim: #8A95B0;
    --text-dark: #E8EEF5;
    --text-dark-muted: #A8B5C8;

    /* 字体 */
    --font-display: "Orbitron", "JetBrains Mono", monospace;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", Consolas, monospace;

    /* 圆角 */
    --r-sm: 4px;
    --r-md: 8px;
    --r-lg: 12px;
    --r-xl: 16px;
    --r-full: 9999px;

    /* 霓虹发光 */
    --glow-cyan: 0 0 8px rgba(0, 240, 255, 0.6), 0 0 16px rgba(0, 240, 255, 0.3);
    --glow-cyan-strong: 0 0 12px rgba(0, 240, 255, 0.8), 0 0 24px rgba(0, 240, 255, 0.4), 0 0 48px rgba(0, 240, 255, 0.2);
    --glow-red: 0 0 8px rgba(255, 59, 92, 0.6), 0 0 16px rgba(255, 59, 92, 0.3);
    --border-glow: 0 0 0 1px rgba(0, 240, 255, 0.4), 0 0 12px rgba(0, 240, 255, 0.25);
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: var(--font-body);
    background: var(--dark-1);
    color: var(--text-bright);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; }

  /* ============ 主页面 ============ */
  #home {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--light-bg);
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
    background-size: 32px 32px;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
  }
  #home.slide-out { transform: translateX(-25%); }

  /* 顶部搜索卡片 - 深色霓虹 */
  .search-card {
    flex-shrink: 0;
    background: var(--dark-1);
    padding: calc(var(--safe-top) + 16px) var(--s-4, 16px) 16px;
    position: relative;
    z-index: 10;
    border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    box-shadow: 0 4px 20px rgba(0, 240, 255, 0.08);
  }
  /* 顶部霓虹分隔线 */
  .search-card::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--neon-cyan) 50%, transparent 100%);
    opacity: 0.6;
  }

  .search-wrap {
    display: flex;
    align-items: center;
    background: var(--dark-2);
    border-radius: var(--r-full);
    padding: 0 16px;
    height: 44px;
    border: 1px solid rgba(0, 240, 255, 0.2);
    transition: all 0.2s;
  }
  .search-wrap:focus-within {
    border-color: var(--neon-cyan);
    box-shadow: var(--border-glow);
    background: var(--dark-3);
  }

  .search-icon {
    width: 18px;
    height: 18px;
    margin-right: 10px;
    color: var(--neon-cyan);
    flex-shrink: 0;
    filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.5));
  }

  .search-wrap input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    outline: none;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--text-bright);
    letter-spacing: 0.02em;
  }
  .search-wrap input::placeholder {
    color: var(--text-dim);
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .search-clear {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--neon-cyan);
    color: var(--dark-1);
    border: none;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .search-clear.show { display: flex; }

  /* 列表滚动区 - 浅色 */
  .list-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 12px calc(var(--safe-bottom) + 96px);
  }

  .list-item {
    background: var(--light-card);
    margin: 0 0 10px;
    padding: 16px;
    border-radius: var(--r-lg);
    border: 1px solid rgba(0, 240, 255, 0.15);
    box-shadow: 0 1px 4px rgba(15, 20, 36, 0.04);
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  /* 左侧霓虹竖条 */
  .list-item::before {
    content: '';
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 3px;
    background: var(--neon-cyan);
    border-radius: 0 2px 2px 0;
    opacity: 0.5;
    transition: opacity 0.18s, box-shadow 0.18s;
  }
  .list-item:active {
    background: var(--light-card-hover);
    transform: scale(0.98);
    border-color: rgba(0, 240, 255, 0.4);
  }
  .list-item:active::before {
    opacity: 1;
    box-shadow: var(--glow-cyan);
  }
  .list-item .title {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 500;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, #00F0FF, #B026FF);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .list-item .arrow {
    color: var(--neon-cyan);
    font-size: 22px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    text-shadow: var(--glow-cyan);
  }

  .empty-tip {
    text-align: center;
    color: var(--text-dark-muted);
    padding: 80px 20px;
    font-size: 14px;
    line-height: 1.8;
  }
  .empty-tip .ico {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    color: var(--neon-cyan);
    filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
  }
  .empty-tip .tip-title {
    font-family: var(--font-display);
    font-size: 14px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dark);
    margin-bottom: 4px;
  }

  /* 添加按钮：底部居中，霓虹圆环 */
  .fab-add {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-bottom) + 20px);
    transform: translateX(-50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--dark-1);
    color: var(--neon-cyan);
    border: 2px solid var(--neon-cyan);
    font-size: 28px;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 20;
    line-height: 1;
    box-shadow: var(--glow-cyan-strong);
    transition: all 0.15s;
  }
  .fab-add:active {
    transform: translateX(-50%) scale(0.9);
    box-shadow: var(--glow-cyan);
  }

  /* ============ 编辑页面 ============ */
  #editor {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--light-bg);
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
    background-size: 32px 32px;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
    visibility: hidden;
  }
  #editor.slide-in { transform: translateX(0); visibility: visible; }
  #editor.slide-out { transform: translateX(100%); visibility: visible; }

  /* 编辑页顶部卡片 - 深色霓虹 */
  .editor-header {
    flex-shrink: 0;
    background: var(--dark-1);
    padding: calc(var(--safe-top) + 12px) 12px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    position: relative;
    z-index: 10;
    border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    box-shadow: 0 4px 20px rgba(0, 240, 255, 0.08);
  }
  .editor-header::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--neon-cyan) 50%, transparent 100%);
    opacity: 0.6;
  }

  .header-btn {
    background: transparent;
    border: 1px solid rgba(0, 240, 255, 0.25);
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--neon-cyan);
    border-radius: var(--r-md);
    transition: all 0.15s;
    min-width: 40px;
    min-height: 40px;
    width: 40px;
    height: 40px;
  }
  .header-btn:active {
    background: var(--neon-cyan-soft);
    box-shadow: var(--glow-cyan);
  }
  .header-btn.back svg { width: 20px; height: 20px; }

  .header-title {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 700;
    color: var(--text-bright);
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .header-btn.delete {
    color: var(--neon-red);
    border-color: rgba(255, 59, 92, 0.3);
    font-size: 24px;
    line-height: 1;
    font-weight: 300;
  }
  .header-btn.delete:active {
    background: rgba(255, 59, 92, 0.15);
    box-shadow: var(--glow-red);
  }

  /* 编辑页内容滚动区 */
  .editor-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 12px calc(var(--safe-bottom) + 40px);
  }

  .field-group {
    background: var(--light-card);
    margin: 0 0 10px;
    border-radius: var(--r-lg);
    border: 1px solid rgba(0, 240, 255, 0.15);
    padding: 12px 16px;
    box-shadow: 0 1px 4px rgba(15, 20, 36, 0.04);
    position: relative;
  }
  /* 左侧霓虹竖条 */
  .field-group::before {
    content: '';
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: 2px;
    background: var(--neon-cyan);
    border-radius: 0 2px 2px 0;
    opacity: 0.4;
  }

  .field-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--neon-cyan);
    margin-bottom: 8px;
    display: block;
    text-shadow: 0 0 6px rgba(0, 240, 255, 0.3);
  }

  .field-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }
  .field-row .input-box { flex: 1; min-width: 0; }

  /* 文本编辑框 */
  .editable {
    background: var(--light-card-hover);
    border: 1px solid transparent;
    border-radius: var(--r-md);
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--text-dark);
    line-height: 1.5;
    min-height: 44px;
    word-break: break-all;
    white-space: pre-wrap;
    cursor: pointer;
    user-select: text;
    -webkit-user-select: text;
    transition: all 0.15s;
  }
  .editable:empty::before { content: ""; }
  .editable.editing {
    background: var(--light-card);
    border-color: var(--neon-cyan);
    box-shadow: var(--border-glow);
    cursor: text;
    outline: none;
    color: var(--text-dark);
  }

  /* 注意事项文本框：自适应高度 */
  .editable.auto-height {
    min-height: 44px;
    overflow: hidden;
    resize: none;
  }

  /* 复制按钮（图标 + 霓虹边框） */
  .copy-btn {
    flex-shrink: 0;
    width: 44px;
    background: var(--dark-1);
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: var(--r-md);
    color: var(--neon-cyan);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .copy-btn:active {
    background: var(--dark-3);
    box-shadow: var(--glow-cyan);
    transform: scale(0.95);
  }
  .copy-btn svg { width: 18px; height: 18px; }

  /* Toast 提示 */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--dark-1);
    color: var(--neon-cyan);
    border: 1px solid var(--neon-cyan);
    padding: 12px 20px;
    border-radius: var(--r-md);
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.05em;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
    box-shadow: var(--glow-cyan-strong);
    text-transform: uppercase;
  }
  .toast.show { opacity: 1; }

  /* 确认弹窗 */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 16, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 9998;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--dark-2);
    border: 1px solid var(--neon-red);
    border-radius: var(--r-xl);
    width: 100%;
    max-width: 320px;
    overflow: hidden;
    box-shadow: 0 0 24px rgba(255, 59, 92, 0.3);
  }
  .modal-title {
    padding: 24px 20px 8px;
    text-align: center;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    color: var(--text-bright);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .modal-desc {
    padding: 0 20px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
  }
  .modal-btns {
    display: flex;
    border-top: 1px solid rgba(0, 240, 255, 0.2);
  }
  .modal-btns button {
    flex: 1;
    background: transparent;
    border: none;
    padding: 14px 0;
    font-size: 14px;
    font-family: var(--font-mono);
    cursor: pointer;
    transition: background 0.15s;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .modal-btns button:first-child {
    color: var(--text-dim);
    border-right: 1px solid rgba(0, 240, 255, 0.2);
  }
  .modal-btns button:last-child {
    color: var(--neon-red);
    font-weight: 700;
    text-shadow: 0 0 6px rgba(255, 59, 92, 0.4);
  }
  .modal-btns button:active { background: rgba(0, 240, 255, 0.08); }

  /* ============ 赛博增强效果 ============ */

  /* 全局扫描线覆盖层 */
  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9000;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 240, 255, 0.12) 0px,
      rgba(0, 240, 255, 0.12) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: screen;
    opacity: 0.6;
  }

  /* 移动扫描线 */
  .scan-beam {
    position: fixed;
    left: 0;
    right: 0;
    height: 80px;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0, 240, 255, 0.18) 50%,
      transparent 100%
    );
    pointer-events: none;
    z-index: 9001;
    animation: scan-beam-move 6s linear infinite;
  }
  @keyframes scan-beam-move {
    0% { top: -80px; }
    100% { top: 100vh; }
  }

  /* 粒子背景 canvas */
  #particleCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.7;
  }

  /* 故障文字效果 */
  .glitch {
    position: relative;
    display: inline-block;
  }
  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .glitch::before {
    color: var(--neon-magenta);
    animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
    z-index: 2;
  }
  .glitch::after {
    color: var(--neon-cyan);
    animation: glitch-anim-2 3s infinite linear alternate-reverse;
    z-index: 1;
  }
  @keyframes glitch-anim-1 {
    0%, 100% { transform: translate(0); clip-path: inset(0 0 0 0); }
    20% { transform: translate(0); clip-path: inset(0 0 0 0); }
    40% { transform: translate(-2px, 1px); clip-path: inset(20% 0 40% 0); }
    60% { transform: translate(0); clip-path: inset(0 0 0 0); }
    80% { transform: translate(1px, -2px); clip-path: inset(70% 0 20% 0); }
  }
  @keyframes glitch-anim-2 {
    0%, 100% { transform: translate(0); clip-path: inset(0 0 0 0); }
    25% { transform: translate(2px, 1px); clip-path: inset(10% 0 80% 0); }
    50% { transform: translate(-2px, -1px); clip-path: inset(50% 0 30% 0); }
    75% { transform: translate(1px, 2px); clip-path: inset(40% 0 60% 0); }
  }

  /* 终端启动动画 */
  #bootScreen {
    position: fixed;
    inset: 0;
    background: var(--dark-0);
    z-index: 10000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: var(--font-mono);
    color: var(--neon-cyan);
    transition: opacity 0.6s, visibility 0.6s;
  }
  #bootScreen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .boot-logo {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.2em;
    margin-bottom: 32px;
    text-shadow: var(--glow-cyan);
    text-align: center;
    line-height: 1.4;
  }
  .boot-logo .sub {
    display: block;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--text-dim);
    margin-top: 8px;
    text-shadow: none;
  }
  .boot-log {
    font-size: 11px;
    line-height: 1.8;
    color: var(--text-dim);
    text-align: left;
    width: 100%;
    max-width: 280px;
    min-height: 120px;
    letter-spacing: 0.05em;
  }
  .boot-log .ok { color: var(--neon-green); }
  .boot-log .warn { color: #FFDD00; }
  .boot-log .cursor {
    display: inline-block;
    width: 8px;
    height: 12px;
    background: var(--neon-cyan);
    vertical-align: middle;
    animation: cursor-blink 0.8s steps(2) infinite;
  }
  @keyframes cursor-blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
  .boot-progress {
    width: 100%;
    max-width: 280px;
    height: 4px;
    background: var(--dark-3);
    border-radius: 2px;
    margin-top: 24px;
    overflow: hidden;
    position: relative;
  }
  .boot-progress::after {
    content: '';
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
    box-shadow: var(--glow-cyan);
    animation: boot-fill 2.2s ease-out forwards;
  }
  @keyframes boot-fill {
    0% { width: 0%; }
    60% { width: 80%; }
    100% { width: 100%; }
  }

  /* 标题霓虹脉冲 */
  .header-title {
    animation: neon-pulse 3s ease-in-out infinite;
  }
  @keyframes neon-pulse {
    0%, 100% { text-shadow: 0 0 8px rgba(255, 59, 92, 0.6), 0 0 24px rgba(255, 59, 92, 0.4); }
    50% { text-shadow: 0 0 12px rgba(255, 59, 92, 1), 0 0 36px rgba(255, 59, 92, 0.8), 0 0 70px rgba(255, 59, 92, 0.5); }
  }

  /* 列表项进入动画 */
  .list-item {
    animation: item-slide-in 0.4s ease-out backwards;
  }
  @keyframes item-slide-in {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* FAB 持续脉冲发光 */
  .fab-add {
    animation: fab-pulse 2.5s ease-in-out infinite;
  }
  @keyframes fab-pulse {
    0%, 100% { box-shadow: var(--glow-cyan-strong); }
    50% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.9), 0 0 40px rgba(0, 240, 255, 0.5), 0 0 80px rgba(0, 240, 255, 0.3); }
  }

  /* 减少动画偏好 */
  @media (prefers-reduced-motion: reduce) {
    .scan-beam, .glitch::before, .glitch::after,
    .boot-progress::after, .header-title, .fab-add, .list-item {
      animation: none !important;
    }
    #bootScreen { display: none !important; }
  }
</style>
</head>

<script>
(function() {
  'use strict';

  var STORAGE_KEY = 'account_password_data_v1';
  var data = [];
  var currentEditId = null;
  var isDirty = false;

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : [];
    } catch (e) { data = []; }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { showToast('保存失败'); }
  }

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 1500);
  }

  function renderList(filter) {
    filter = filter || '';
    var scroll = document.getElementById('listScroll');
    var filtered = data.filter(function(item) {
      return !filter || (item.title && item.title.toLowerCase().indexOf(filter.toLowerCase()) >= 0);
    });

    // 按标题字母表自动排序（中文取拼音首字母，与英文统一 A-Z 排序）
    filtered.sort(function(a, b) {
      var ka = firstSortKey((a.title || '').trim());
      var kb = firstSortKey((b.title || '').trim());
      if (ka === '~') return 1;
      if (kb === '~') return -1;
      return ka.localeCompare(kb, 'en', { sensitivity: 'base' });
    });

    if (filtered.length === 0) {
      var msg = filter ? '没有匹配的记录' : '点击下方 + 添加第一条记录';
      scroll.innerHTML =
        '<div class="empty-tip">' +
        '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>' +
        '<path d="M7 11V7a5 5 0 0 1 10 0v4"/>' +
        '</svg>' +
        '<div class="tip-title">NO DATA</div>' + msg + '</div>';
      return;
    }

    var html = '';
    filtered.forEach(function(item) {
      var safeTitle = escapeHtml(item.title || '未命名');
      html += '<div class="list-item" data-id="' + item.id + '">' +
              '<div class="title">' + safeTitle + '</div>' +
              '<div class="arrow">›</div>' +
              '</div>';
    });
    scroll.innerHTML = html;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ============ 拼音首字母查表 ============
  // 基于 Unicode 区间：每项 [首字母, 该首字母汉字区间的起始码点]
  // 按码点升序排列，找到第一个 <= charCode 的区间即为该字首字母
  var PINYIN_BOUNDS = [
    ['A', 0x5440], ['B', 0x554A], ['C', 0x5688], ['D', 0x58F6],
    ['E', 0x5B7F], ['F', 0x5C60], ['G', 0x5DE5], ['H', 0x60B2],
    ['J', 0x6251], ['K', 0x6606], ['L', 0x673D], ['M', 0x6B6A],
    ['N', 0x6F4D], ['O', 0x704C], ['P', 0x711A], ['Q', 0x72C0],
    ['R', 0x7409], ['S', 0x7476], ['T', 0x7792], ['W', 0x7834],
    ['X', 0x7A17], ['Y', 0x7B51], ['Z', 0x7C7B]
  ];
  var PINYIN_START = 0x554A; // 啊
  var PINYIN_END = 0x7C7B;   // 髾 区间最后一个字母 Z

  function pinyinFirstLetter(ch) {
    var code = ch.charCodeAt(0);
    if (code < PINYIN_START || code > PINYIN_END) return '';
    // 倒序找第一个起始码 <= code 的区间
    for (var i = PINYIN_BOUNDS.length - 1; i >= 0; i--) {
      if (code >= PINYIN_BOUNDS[i][1]) return PINYIN_BOUNDS[i][0];
    }
    return '';
  }

  // 取标题排序键：首字符中文转拼音首字母，英文/数字取字符大写，空标题返回 ~
  function firstSortKey(title) {
    if (!title) return '~';
    var c = title.charAt(0);
    // 英文字母
    if (/[A-Za-z]/.test(c)) return c.toUpperCase();
    // 数字 → 排在字母前
    if (/[0-9]/.test(c)) return '0' + c;
    // 中文 → 拼音首字母
    if (/[\u4e00-\u9fff]/.test(c)) {
      var f = pinyinFirstLetter(c);
      return f || '~';
    }
    // 其他符号排到最后
    return '~';
  }

  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');

  searchInput.addEventListener('input', function() {
    var v = this.value;
    searchClear.classList.toggle('show', !!v);
    renderList(v);
  });

  searchClear.addEventListener('click', function() {
    searchInput.value = '';
    searchClear.classList.remove('show');
    renderList('');
  });

  document.getElementById('listScroll').addEventListener('click', function(e) {
    var item = e.target.closest('.list-item');
    if (!item) return;
    openEditor(item.getAttribute('data-id'));
  });

  var editor = document.getElementById('editor');
  var home = document.getElementById('home');

  // ============ 故障标题 ============
  function setEditorTitle(text) {
    var titleEl = document.getElementById('editorTitle');
    var short = text.length > 12 ? text.slice(0, 12) + '…' : text;
    titleEl.innerHTML = '<span class="glitch" data-text="' + escapeAttr(short) + '">' + escapeHtml(short) + '</span>';
  }
  function escapeAttr(s) {
    return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function openEditor(id) {
    currentEditId = id || null;
    var item;
    if (id) {
      item = data.filter(function(d) { return String(d.id) === String(id); })[0];
      if (!item) return;
      setEditorTitle(item.title || '编辑');
      document.getElementById('deleteBtn').style.display = 'flex';
    } else {
      item = { title:'', account:'', password:'', phone:'', email:'', initPassword:'', notes:'' };
      setEditorTitle('新建');
      document.getElementById('deleteBtn').style.display = 'none';
    }

    document.querySelectorAll('.editable').forEach(function(el) {
      var field = el.getAttribute('data-field');
      el.textContent = item[field] || '';
      el.classList.remove('editing');
      if (el.classList.contains('auto-height')) autoGrow(el);
    });

    isDirty = false;
    editor.classList.add('slide-in');
    home.classList.add('slide-out');
  }

  function closeEditor() {
    if (isDirty) saveCurrent();
    editor.classList.remove('slide-in');
    editor.classList.add('slide-out');
    home.classList.remove('slide-out');
    setTimeout(function() {
      editor.classList.remove('slide-out');
      isDirty = false;
    }, 360);
  }

  document.getElementById('backBtn').addEventListener('click', closeEditor);

  document.getElementById('deleteBtn').addEventListener('click', function() {
    document.getElementById('modalMask').classList.add('show');
  });
  document.getElementById('cancelDelete').addEventListener('click', function() {
    document.getElementById('modalMask').classList.remove('show');
  });
  document.getElementById('confirmDelete').addEventListener('click', function() {
    document.getElementById('modalMask').classList.remove('show');
    if (currentEditId) {
      data = data.filter(function(d) { return String(d.id) !== String(currentEditId); });
      saveData();
      renderList(searchInput.value);
      isDirty = false;
      closeEditor();
      showToast('已删除');
    }
  });

  function enterEdit(el) {
    el.classList.add('editing');
    el.contentEditable = 'true';
    el.focus();
    var range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  document.querySelectorAll('.editable').forEach(function(el) {
    var lastTap = 0;
    var tapTimeout = null;

    function handleTap() {
      var now = Date.now();
      if (now - lastTap < 300) {
        if (tapTimeout) { clearTimeout(tapTimeout); tapTimeout = null; }
        lastTap = 0;
        enterEdit(el);
        return;
      }
      lastTap = now;
      if (tapTimeout) clearTimeout(tapTimeout);
      tapTimeout = setTimeout(function() { tapTimeout = null; lastTap = 0; }, 300);
    }

    el.addEventListener('dblclick', function(e) { e.preventDefault(); enterEdit(el); });
    el.addEventListener('touchend', function(e) { e.preventDefault(); handleTap(); });

    el.addEventListener('blur', function() {
      el.contentEditable = 'false';
      el.classList.remove('editing');
      if (el.classList.contains('auto-height')) autoGrow(el);
      markDirty();
    });

    if (el.getAttribute('data-singleline') === '1') {
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      });
      el.addEventListener('paste', function(e) {
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text');
        text = text.replace(/[\r\n]+/g, ' ');
        document.execCommand('insertText', false, text);
      });
    }

    if (el.classList.contains('auto-height')) {
      el.addEventListener('input', function() { autoGrow(el); });
    }
  });

  function autoGrow(el) {
    el.style.height = 'auto';
    var newHeight = Math.max(el.scrollHeight, 44);
    el.style.height = newHeight + 'px';
  }

  function markDirty() { isDirty = true; }

  document.querySelectorAll('.copy-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var field = btn.getAttribute('data-copy');
      var el = document.querySelector('.editable[data-field="' + field + '"]');
      var text = el ? el.textContent : '';
      if (!text) { showToast('内容为空'); return; }
      copyText(text, function(ok) { showToast(ok ? '已复制' : '复制失败'); });
    });
  });

  function copyText(text, cb) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() { cb(true); }).catch(function() { fallbackCopy(text, cb); });
    } else { fallbackCopy(text, cb); }
  }

  function fallbackCopy(text, cb) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      cb(ok);
    } catch (e) { cb(false); }
  }

  function saveCurrent() {
    var item = {};
    document.querySelectorAll('.editable').forEach(function(el) {
      var field = el.getAttribute('data-field');
      item[field] = el.textContent;
    });

    if (!item.title || !item.title.trim()) return false;

    if (currentEditId) {
      for (var i = 0; i < data.length; i++) {
        if (String(data[i].id) === String(currentEditId)) {
          data[i] = Object.assign(data[i], item);
          break;
        }
      }
    } else {
      item.id = Date.now() + '' + Math.floor(Math.random() * 1000);
      item.createTime = Date.now();
      data.push(item);
      currentEditId = item.id;
    }

    saveData();
    renderList(searchInput.value);
    return true;
  }

  document.getElementById('fabAdd').addEventListener('click', function() {
    openEditor(null);
  });

  window.addEventListener('popstate', function() {
    if (editor.classList.contains('slide-in')) {
      closeEditor();
      history.pushState(null, '', location.href);
    }
  });

  loadData();
  renderList();

  // ============ 启动序列 ============
  function bootSequence() {
    var boot = document.getElementById('bootScreen');
    var log = document.getElementById('bootLog');
    var lines = [
      { t: '> 初始化安全模块', s: 'ok', d: 200 },
      { t: '> 加载加密协议 [AES-256]', s: 'ok', d: 300 },
      { t: '> 校验本地存储完整性', s: 'ok', d: 280 },
      { t: '> 建立量子隧道连接...', s: '', d: 350 },
      { t: '> 警告: 离线模式', s: 'warn', d: 200 },
      { t: '> 加载 ' + data.length + ' 条加密记录', s: 'ok', d: 250 },
      { t: '> 系统就绪', s: 'ok', d: 200 }
    ];
    var i = 0;
    function next() {
      if (i >= lines.length) {
        setTimeout(function() {
          boot.classList.add('hide');
          setTimeout(function() { boot.style.display = 'none'; }, 700);
        }, 400);
        return;
      }
      var L = lines[i];
      var colorClass = L.s === 'ok' ? 'ok' : (L.s === 'warn' ? 'warn' : '');
      var span = '<span class="' + colorClass + '">' + escapeHtml(L.t) + '</span>';
      log.innerHTML += span + '<br>';
      var curs = document.createElement('span');
      curs.className = 'cursor';
      log.appendChild(curs);
      i++;
      setTimeout(function() {
        if (curs && curs.parentNode) curs.parentNode.removeChild(curs);
        next();
      }, L.d);
    }
    setTimeout(next, 300);
  }
  bootSequence();

  // ============ 粒子背景动画 ============
  function initParticles() {
    var canvas = document.getElementById('particleCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var particles = [];
    var W = 0, H = 0;
    var COUNT = Math.min(60, Math.floor(window.innerWidth / 8));
    var rafId = null;
    var running = true;

    function resize() {
      W = canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
      H = canvas.height = window.innerHeight * (window.devicePixelRatio || 1);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
    }

    function spawn() {
      return {
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: Math.random() * 1.5 + 0.5,
        a: Math.random() * 0.5 + 0.2
      };
    }

    for (var i = 0; i < COUNT; i++) particles.push(spawn());

    function draw() {
      if (!running) return;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      // 连线
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > window.innerWidth) p.vx *= -1;
        if (p.y < 0 || p.y > window.innerHeight) p.vy *= -1;
        // 点
        ctx.fillStyle = 'rgba(0, 240, 255, ' + p.a + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        // 连线
        for (var j = i + 1; j < particles.length; j++) {
          var q = particles[j];
          var dx = p.x - q.x, dy = p.y - q.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 100) {
            var alpha = (1 - dist / 100) * 0.15;
            ctx.strokeStyle = 'rgba(0, 240, 255, ' + alpha + ')';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
        }
      }
      rafId = requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', resize);
    // 页面不可见时暂停
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
      } else if (!running) {
        running = true;
        draw();
      }
    });
    draw();
  }

  // 等启动屏结束后再启动粒子（节省启动期资源）
  setTimeout(initParticles, 2400);

  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

})();
</script>
</body>
</html>
