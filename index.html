<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0E1A">
<title>账号密码管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  /* ============ Tech HUD Design Tokens ============ */
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);

    /* 霓虹色系 */
    --neon-cyan: #00F0FF;
    --neon-cyan-soft: rgba(0, 240, 255, 0.15);
    --neon-magenta: #FF2E97;
    --neon-purple: #B026FF;
    --neon-green: #39FF14;
    --neon-red: #FF3B5C;

    /* 深色背景层级 */
    --dark-0: #050810;       /* 最深 */
    --dark-1: #0A0E1A;       /* 主深色 */
    --dark-2: #0F1424;       /* 卡片深色 */
    --dark-3: #1A1F35;       /* 浅深色 */

    /* 浅色列表区 */
    --light-bg: #EAEEF5;
    --light-card: #FFFFFF;
    --light-card-hover: #F5F7FB;

    /* 文字 */
    --text-bright: #FFFFFF;
    --text-cyan: #00F0FF;
    --text-dim: #8A95B0;
    --text-dark: #0F1424;
    --text-dark-muted: #5A6280;

    /* 字体 */
    --font-display: "Orbitron", "JetBrains Mono", monospace;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", Consolas, monospace;

    /* 圆角 */
    --r-sm: 4px;
    --r-md: 8px;
    --r-lg: 12px;
    --r-xl: 16px;
    --r-full: 9999px;

    /* 霓虹发光 */
    --glow-cyan: 0 0 8px rgba(0, 240, 255, 0.6), 0 0 16px rgba(0, 240, 255, 0.3);
    --glow-cyan-strong: 0 0 12px rgba(0, 240, 255, 0.8), 0 0 24px rgba(0, 240, 255, 0.4), 0 0 48px rgba(0, 240, 255, 0.2);
    --glow-red: 0 0 8px rgba(255, 59, 92, 0.6), 0 0 16px rgba(255, 59, 92, 0.3);
    --border-glow: 0 0 0 1px rgba(0, 240, 255, 0.4), 0 0 12px rgba(0, 240, 255, 0.25);
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: var(--font-body);
    background: var(--dark-1);
    color: var(--text-bright);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; }

  /* ============ 主页面 ============ */
  #home {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--light-bg);
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
    background-size: 32px 32px;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
  }
  #home.slide-out { transform: translateX(-25%); }

  /* 顶部搜索卡片 - 深色霓虹 */
  .search-card {
    flex-shrink: 0;
    background: var(--dark-1);
    padding: calc(var(--safe-top) + 16px) var(--s-4, 16px) 16px;
    position: relative;
    z-index: 10;
    border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    box-shadow: 0 4px 20px rgba(0, 240, 255, 0.08);
  }
  /* 顶部霓虹分隔线 */
  .search-card::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--neon-cyan) 50%, transparent 100%);
    opacity: 0.6;
  }

  .search-wrap {
    display: flex;
    align-items: center;
    background: var(--dark-2);
    border-radius: var(--r-full);
    padding: 0 16px;
    height: 44px;
    border: 1px solid rgba(0, 240, 255, 0.2);
    transition: all 0.2s;
  }
  .search-wrap:focus-within {
    border-color: var(--neon-cyan);
    box-shadow: var(--border-glow);
    background: var(--dark-3);
  }

  .search-icon {
    width: 18px;
    height: 18px;
    margin-right: 10px;
    color: var(--neon-cyan);
    flex-shrink: 0;
    filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.5));
  }

  .search-wrap input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    outline: none;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--text-bright);
    letter-spacing: 0.02em;
  }
  .search-wrap input::placeholder {
    color: var(--text-dim);
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .search-clear {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--neon-cyan);
    color: var(--dark-1);
    border: none;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .search-clear.show { display: flex; }

  /* 列表滚动区 - 浅色 */
  .list-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 12px calc(var(--safe-bottom) + 96px);
  }

  .list-item {
    background: var(--light-card);
    margin: 0 0 10px;
    padding: 16px;
    border-radius: var(--r-lg);
    border: 1px solid rgba(0, 240, 255, 0.15);
    box-shadow: 0 1px 4px rgba(15, 20, 36, 0.04);
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  /* 左侧霓虹竖条 */
  .list-item::before {
    content: '';
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 3px;
    background: var(--neon-cyan);
    border-radius: 0 2px 2px 0;
    opacity: 0.5;
    transition: opacity 0.18s, box-shadow 0.18s;
  }
  .list-item:active {
    background: var(--light-card-hover);
    transform: scale(0.98);
    border-color: rgba(0, 240, 255, 0.4);
  }
  .list-item:active::before {
    opacity: 1;
    box-shadow: var(--glow-cyan);
  }
  .list-item .title {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 500;
    color: var(--text-dark);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .list-item .arrow {
    color: var(--neon-cyan);
    font-size: 22px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    text-shadow: var(--glow-cyan);
  }

  .empty-tip {
    text-align: center;
    color: var(--text-dark-muted);
    padding: 80px 20px;
    font-size: 14px;
    line-height: 1.8;
  }
  .empty-tip .ico {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    color: var(--neon-cyan);
    filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
  }
  .empty-tip .tip-title {
    font-family: var(--font-display);
    font-size: 14px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dark);
    margin-bottom: 4px;
  }

  /* 添加按钮：底部居中，霓虹圆环 */
  .fab-add {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-bottom) + 20px);
    transform: translateX(-50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--dark-1);
    color: var(--neon-cyan);
    border: 2px solid var(--neon-cyan);
    font-size: 28px;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 20;
    line-height: 1;
    box-shadow: var(--glow-cyan-strong);
    transition: all 0.15s;
  }
  .fab-add:active {
    transform: translateX(-50%) scale(0.9);
    box-shadow: var(--glow-cyan);
  }

  /* ============ 编辑页面 ============ */
  #editor {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--light-bg);
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
    background-size: 32px 32px;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
    visibility: hidden;
  }
  #editor.slide-in { transform: translateX(0); visibility: visible; }
  #editor.slide-out { transform: translateX(100%); visibility: visible; }

  /* 编辑页顶部卡片 - 深色霓虹 */
  .editor-header {
    flex-shrink: 0;
    background: var(--dark-1);
    padding: calc(var(--safe-top) + 12px) 12px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    position: relative;
    z-index: 10;
    border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    box-shadow: 0 4px 20px rgba(0, 240, 255, 0.08);
  }
  .editor-header::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--neon-cyan) 50%, transparent 100%);
    opacity: 0.6;
  }

  .header-btn {
    background: transparent;
    border: 1px solid rgba(0, 240, 255, 0.25);
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--neon-cyan);
    border-radius: var(--r-md);
    transition: all 0.15s;
    min-width: 40px;
    min-height: 40px;
    width: 40px;
    height: 40px;
  }
  .header-btn:active {
    background: var(--neon-cyan-soft);
    box-shadow: var(--glow-cyan);
  }
  .header-btn.back svg { width: 20px; height: 20px; }

  .header-title {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 700;
    color: var(--text-bright);
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .header-btn.delete {
    color: var(--neon-red);
    border-color: rgba(255, 59, 92, 0.3);
    font-size: 24px;
    line-height: 1;
    font-weight: 300;
  }
  .header-btn.delete:active {
    background: rgba(255, 59, 92, 0.15);
    box-shadow: var(--glow-red);
  }

  /* 编辑页内容滚动区 */
  .editor-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 12px calc(var(--safe-bottom) + 40px);
  }

  .field-group {
    background: var(--light-card);
    margin: 0 0 10px;
    border-radius: var(--r-lg);
    border: 1px solid rgba(0, 240, 255, 0.15);
    padding: 12px 16px;
    box-shadow: 0 1px 4px rgba(15, 20, 36, 0.04);
    position: relative;
  }
  /* 左侧霓虹竖条 */
  .field-group::before {
    content: '';
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: 2px;
    background: var(--neon-cyan);
    border-radius: 0 2px 2px 0;
    opacity: 0.4;
  }

  .field-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--neon-cyan);
    margin-bottom: 8px;
    display: block;
    text-shadow: 0 0 6px rgba(0, 240, 255, 0.3);
  }

  .field-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }
  .field-row .input-box { flex: 1; min-width: 0; }

  /* 文本编辑框 */
  .editable {
    background: var(--light-card-hover);
    border: 1px solid transparent;
    border-radius: var(--r-md);
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--text-dark);
    line-height: 1.5;
    min-height: 44px;
    word-break: break-all;
    white-space: pre-wrap;
    cursor: pointer;
    user-select: text;
    -webkit-user-select: text;
    transition: all 0.15s;
  }
  .editable:empty::before { content: ""; }
  .editable.editing {
    background: var(--light-card);
    border-color: var(--neon-cyan);
    box-shadow: var(--border-glow);
    cursor: text;
    outline: none;
    color: var(--text-dark);
  }

  /* 注意事项文本框：自适应高度 */
  .editable.auto-height {
    min-height: 44px;
    overflow: hidden;
    resize: none;
  }

  /* 复制按钮（图标 + 霓虹边框） */
  .copy-btn {
    flex-shrink: 0;
    width: 44px;
    background: var(--dark-1);
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: var(--r-md);
    color: var(--neon-cyan);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .copy-btn:active {
    background: var(--dark-3);
    box-shadow: var(--glow-cyan);
    transform: scale(0.95);
  }
  .copy-btn svg { width: 18px; height: 18px; }

  /* Toast 提示 */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--dark-1);
    color: var(--neon-cyan);
    border: 1px solid var(--neon-cyan);
    padding: 12px 20px;
    border-radius: var(--r-md);
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.05em;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
    box-shadow: var(--glow-cyan-strong);
    text-transform: uppercase;
  }
  .toast.show { opacity: 1; }

  /* 确认弹窗 */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 16, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 9998;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--dark-2);
    border: 1px solid var(--neon-red);
    border-radius: var(--r-xl);
    width: 100%;
    max-width: 320px;
    overflow: hidden;
    box-shadow: 0 0 24px rgba(255, 59, 92, 0.3);
  }
  .modal-title {
    padding: 24px 20px 8px;
    text-align: center;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    color: var(--text-bright);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .modal-desc {
    padding: 0 20px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
  }
  .modal-btns {
    display: flex;
    border-top: 1px solid rgba(0, 240, 255, 0.2);
  }
  .modal-btns button {
    flex: 1;
    background: transparent;
    border: none;
    padding: 14px 0;
    font-size: 14px;
    font-family: var(--font-mono);
    cursor: pointer;
    transition: background 0.15s;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .modal-btns button:first-child {
    color: var(--text-dim);
    border-right: 1px solid rgba(0, 240, 255, 0.2);
  }
  .modal-btns button:last-child {
    color: var(--neon-red);
    font-weight: 700;
    text-shadow: 0 0 6px rgba(255, 59, 92, 0.4);
  }
  .modal-btns button:active { background: rgba(0, 240, 255, 0.08); }
</style>
</head>
<body>

<!-- ============ 主页面 ============ -->
<div id="home">
  <div class="search-card">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="搜索">
      <button class="search-clear" id="searchClear" aria-label="清除">×</button>
    </div>
  </div>

  <div class="list-scroll" id="listScroll"></div>

  <button class="fab-add" id="fabAdd" aria-label="新建">+</button>
</div>

<!-- ============ 编辑页面 ============ -->
<div id="editor">
  <div class="editor-header">
    <button class="header-btn back" id="backBtn" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <div class="header-title" id="editorTitle">新建</div>
    <button class="header-btn delete" id="deleteBtn" aria-label="删除">×</button>
  </div>

  <div class="editor-scroll">
    <div class="field-group">
      <label class="field-label">标题</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="title" data-singleline="1"></div></div>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">账号</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="account" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="account" aria-label="复制账号">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">密码</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="password" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="password" aria-label="复制密码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">手机</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="phone" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="phone" aria-label="复制手机">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">邮箱</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="email" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="email" aria-label="复制邮箱">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">初始密码</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="initPassword" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="initPassword" aria-label="复制初始密码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">注意事项</label>
      <div class="field-row">
        <div class="input-box"><div class="editable auto-height" data-field="notes"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-title">确认删除</div>
    <div class="modal-desc">删除后无法恢复，确定要删除吗？</div>
    <div class="modal-btns">
      <button id="cancelDelete">取消</button>
      <button id="confirmDelete">删除</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var STORAGE_KEY = 'account_password_data_v1';
  var data = [];
  var currentEditId = null;
  var isDirty = false;

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : [];
    } catch (e) { data = []; }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { showToast('保存失败'); }
  }

  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 1500);
  }

  function renderList(filter) {
    filter = filter || '';
    var scroll = document.getElementById('listScroll');
    var filtered = data.filter(function(item) {
      return !filter || (item.title && item.title.toLowerCase().indexOf(filter.toLowerCase()) >= 0);
    });

    if (filtered.length === 0) {
      var msg = filter ? '没有匹配的记录' : '点击下方 + 添加第一条记录';
      scroll.innerHTML =
        '<div class="empty-tip">' +
        '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>' +
        '<path d="M7 11V7a5 5 0 0 1 10 0v4"/>' +
        '</svg>' +
        '<div class="tip-title">NO DATA</div>' + msg + '</div>';
      return;
    }

    var html = '';
    filtered.forEach(function(item) {
      var safeTitle = escapeHtml(item.title || '未命名');
      html += '<div class="list-item" data-id="' + item.id + '">' +
              '<div class="title">' + safeTitle + '</div>' +
              '<div class="arrow">›</div>' +
              '</div>';
    });
    scroll.innerHTML = html;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');

  searchInput.addEventListener('input', function() {
    var v = this.value;
    searchClear.classList.toggle('show', !!v);
    renderList(v);
  });

  searchClear.addEventListener('click', function() {
    searchInput.value = '';
    searchClear.classList.remove('show');
    renderList('');
  });

  document.getElementById('listScroll').addEventListener('click', function(e) {
    var item = e.target.closest('.list-item');
    if (!item) return;
    openEditor(item.getAttribute('data-id'));
  });

  var editor = document.getElementById('editor');
  var home = document.getElementById('home');

  function openEditor(id) {
    currentEditId = id || null;
    var item;
    if (id) {
      item = data.filter(function(d) { return String(d.id) === String(id); })[0];
      if (!item) return;
      document.getElementById('editorTitle').textContent = item.title || '编辑';
      document.getElementById('deleteBtn').style.display = 'flex';
    } else {
      item = { title:'', account:'', password:'', phone:'', email:'', initPassword:'', notes:'' };
      document.getElementById('editorTitle').textContent = '新建';
      document.getElementById('deleteBtn').style.display = 'none';
    }

    document.querySelectorAll('.editable').forEach(function(el) {
      var field = el.getAttribute('data-field');
      el.textContent = item[field] || '';
      el.classList.remove('editing');
      if (el.classList.contains('auto-height')) autoGrow(el);
    });

    isDirty = false;
    editor.classList.add('slide-in');
    home.classList.add('slide-out');
  }

  function closeEditor() {
    if (isDirty) saveCurrent();
    editor.classList.remove('slide-in');
    editor.classList.add('slide-out');
    home.classList.remove('slide-out');
    setTimeout(function() {
      editor.classList.remove('slide-out');
      isDirty = false;
    }, 360);
  }

  document.getElementById('backBtn').addEventListener('click', closeEditor);

  document.getElementById('deleteBtn').addEventListener('click', function() {
    document.getElementById('modalMask').classList.add('show');
  });
  document.getElementById('cancelDelete').addEventListener('click', function() {
    document.getElementById('modalMask').classList.remove('show');
  });
  document.getElementById('confirmDelete').addEventListener('click', function() {
    document.getElementById('modalMask').classList.remove('show');
    if (currentEditId) {
      data = data.filter(function(d) { return String(d.id) !== String(currentEditId); });
      saveData();
      renderList(searchInput.value);
      isDirty = false;
      closeEditor();
      showToast('已删除');
    }
  });

  function enterEdit(el) {
    el.classList.add('editing');
    el.contentEditable = 'true';
    el.focus();
    var range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  document.querySelectorAll('.editable').forEach(function(el) {
    var lastTap = 0;
    var tapTimeout = null;

    function handleTap() {
      var now = Date.now();
      if (now - lastTap < 300) {
        if (tapTimeout) { clearTimeout(tapTimeout); tapTimeout = null; }
        lastTap = 0;
        enterEdit(el);
        return;
      }
      lastTap = now;
      if (tapTimeout) clearTimeout(tapTimeout);
      tapTimeout = setTimeout(function() { tapTimeout = null; lastTap = 0; }, 300);
    }

    el.addEventListener('dblclick', function(e) { e.preventDefault(); enterEdit(el); });
    el.addEventListener('touchend', function(e) { e.preventDefault(); handleTap(); });

    el.addEventListener('blur', function() {
      el.contentEditable = 'false';
      el.classList.remove('editing');
      if (el.classList.contains('auto-height')) autoGrow(el);
      markDirty();
    });

    if (el.getAttribute('data-singleline') === '1') {
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      });
      el.addEventListener('paste', function(e) {
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text');
        text = text.replace(/[\r\n]+/g, ' ');
        document.execCommand('insertText', false, text);
      });
    }

    if (el.classList.contains('auto-height')) {
      el.addEventListener('input', function() { autoGrow(el); });
    }
  });

  function autoGrow(el) {
    el.style.height = 'auto';
    var newHeight = Math.max(el.scrollHeight, 44);
    el.style.height = newHeight + 'px';
  }

  function markDirty() { isDirty = true; }

  document.querySelectorAll('.copy-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var field = btn.getAttribute('data-copy');
      var el = document.querySelector('.editable[data-field="' + field + '"]');
      var text = el ? el.textContent : '';
      if (!text) { showToast('内容为空'); return; }
      copyText(text, function(ok) { showToast(ok ? '已复制' : '复制失败'); });
    });
  });

  function copyText(text, cb) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() { cb(true); }).catch(function() { fallbackCopy(text, cb); });
    } else { fallbackCopy(text, cb); }
  }

  function fallbackCopy(text, cb) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      cb(ok);
    } catch (e) { cb(false); }
  }

  function saveCurrent() {
    var item = {};
    document.querySelectorAll('.editable').forEach(function(el) {
      var field = el.getAttribute('data-field');
      item[field] = el.textContent;
    });

    if (!item.title || !item.title.trim()) return false;

    if (currentEditId) {
      for (var i = 0; i < data.length; i++) {
        if (String(data[i].id) === String(currentEditId)) {
          data[i] = Object.assign(data[i], item);
          break;
        }
      }
    } else {
      item.id = Date.now() + '' + Math.floor(Math.random() * 1000);
      item.createTime = Date.now();
      data.push(item);
      currentEditId = item.id;
    }

    saveData();
    renderList(searchInput.value);
    return true;
  }

  document.getElementById('fabAdd').addEventListener('click', function() {
    openEditor(null);
  });

  window.addEventListener('popstate', function() {
    if (editor.classList.contains('slide-in')) {
      closeEditor();
      history.pushState(null, '', location.href);
    }
  });

  loadData();
  renderList();

  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

})();
</script>
</body>
</html>
