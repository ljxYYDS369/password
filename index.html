<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<title>账号密码管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&family=Inconsolata:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  /* ============ Clean Design Tokens ============ */
  :root {
    /* safe area */
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);

    /* color palette */
    --primary: #3B82F6;
    --primary-hover: #2563EB;
    --primary-soft: #EFF6FF;
    --secondary: #8B5CF6;
    --success: #16A34A;
    --warning: #D97706;
    --danger: #DC2626;
    --danger-soft: #FEE2E2;
    --surface: #FFFFFF;
    --text: #111827;
    --text-muted: #6B7280;
    --text-subtle: #9CA3AF;
    --border: #E5E7EB;
    --border-strong: #D1D5DB;
    --neutral-50: #F9FAFB;
    --neutral-100: #F3F4F6;
    --neutral-200: #E5E7EB;
    --neutral-300: #D1D5DB;
    --bg: #F9FAFB;

    /* typography */
    --font-display: "Poppins", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-body: "Roboto", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "Inconsolata", "SF Mono", Consolas, monospace;

    /* radius */
    --r-sm: 4px;
    --r-md: 8px;
    --r-lg: 12px;
    --r-xl: 16px;
    --r-full: 9999px;

    /* spacing (8pt baseline) */
    --s-1: 4px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 24px;
    --s-6: 32px;

    /* shadow */
    --shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.04);
    --shadow-md: 0 2px 8px rgba(17, 24, 39, 0.06);
    --shadow-lg: 0 4px 16px rgba(17, 24, 39, 0.08);
    --shadow-focus: 0 0 0 3px rgba(59, 130, 246, 0.18);
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button { font-family: inherit; }

  /* ============ 主页面 ============ */
  #home {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
  }
  #home.slide-out { transform: translateX(-25%); }

  /* 顶部搜索卡片 */
  .search-card {
    flex-shrink: 0;
    background: var(--surface);
    padding: calc(var(--safe-top) + 16px) var(--s-4) var(--s-4);
    box-shadow: var(--shadow-md);
    position: relative;
    z-index: 10;
  }

  .search-wrap {
    display: flex;
    align-items: center;
    background: var(--neutral-100);
    border-radius: var(--r-full);
    padding: 0 var(--s-4);
    height: 44px;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .search-wrap:focus-within {
    background: var(--surface);
    box-shadow: var(--shadow-focus), var(--shadow-sm);
  }

  .search-icon {
    width: 18px;
    height: 18px;
    margin-right: var(--s-2);
    color: var(--text-subtle);
    flex-shrink: 0;
  }

  .search-wrap input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    outline: none;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--text);
  }
  .search-wrap input::placeholder { color: var(--text-subtle); }

  .search-clear {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--neutral-300);
    color: #fff;
    border: none;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .search-clear.show { display: flex; }

  /* 列表滚动区 */
  .list-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: var(--s-3) var(--s-3) calc(var(--safe-bottom) + 96px);
  }

  .list-item {
    background: var(--surface);
    margin: 0 0 var(--s-2);
    padding: var(--s-4);
    border-radius: var(--r-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s-3);
  }
  .list-item:active {
    background: var(--neutral-50);
    transform: scale(0.98);
  }
  .list-item .title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .list-item .arrow {
    color: var(--text-subtle);
    font-size: 20px;
    flex-shrink: 0;
  }

  .empty-tip {
    text-align: center;
    color: var(--text-muted);
    padding: 80px 20px;
    font-size: 14px;
    line-height: 1.8;
  }
  .empty-tip .ico {
    width: 48px;
    height: 48px;
    margin: 0 auto 16px;
    color: var(--neutral-300);
  }

  /* 添加按钮：底部居中 */
  .fab-add {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-bottom) + 20px);
    transform: translateX(-50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    font-size: 28px;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
    cursor: pointer;
    z-index: 20;
    line-height: 1;
    transition: background 0.15s, transform 0.1s;
  }
  .fab-add:active { transform: translateX(-50%) scale(0.92); }

  /* ============ 编辑页面 ============ */
  #editor {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
    visibility: hidden;
  }
  #editor.slide-in { transform: translateX(0); visibility: visible; }
  #editor.slide-out { transform: translateX(100%); visibility: visible; }

  /* 编辑页顶部卡片 */
  .editor-header {
    flex-shrink: 0;
    background: var(--surface);
    padding: calc(var(--safe-top) + 12px) var(--s-3) var(--s-3);
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--s-2);
    position: relative;
    z-index: 10;
  }

  .header-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: var(--s-2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    border-radius: var(--r-md);
    transition: background 0.15s, color 0.15s;
    min-width: 40px;
    min-height: 40px;
  }
  .header-btn:active { background: var(--neutral-100); }
  .header-btn.back { color: var(--primary); }
  .header-btn.back svg { width: 22px; height: 22px; }

  .header-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
  }

  .header-btn.delete {
    color: var(--danger);
    width: 36px;
    height: 36px;
    font-size: 24px;
    line-height: 1;
    font-weight: 300;
  }

  /* 编辑页内容滚动区 */
  .editor-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: var(--s-3) var(--s-3) calc(var(--safe-bottom) + 40px);
  }

  .field-group {
    background: var(--surface);
    margin: 0 0 var(--s-2);
    border-radius: var(--r-lg);
    border: 1px solid var(--border);
    padding: var(--s-3) var(--s-4);
    box-shadow: var(--shadow-sm);
  }

  .field-label {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: var(--s-2);
    display: block;
  }

  .field-row {
    display: flex;
    align-items: stretch;
    gap: var(--s-2);
  }
  .field-row .input-box {
    flex: 1;
    min-width: 0;
  }

  /* 文本编辑框 */
  .editable {
    background: var(--neutral-50);
    border: 1px solid transparent;
    border-radius: var(--r-md);
    padding: 10px 12px;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--text);
    line-height: 1.5;
    min-height: 44px;
    word-break: break-all;
    white-space: pre-wrap;
    cursor: pointer;
    user-select: text;
    -webkit-user-select: text;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .editable:empty::before { content: ""; }
  .editable.editing {
    background: var(--surface);
    border-color: var(--primary);
    box-shadow: var(--shadow-focus);
    cursor: text;
    outline: none;
  }

  /* 注意事项文本框：自适应高度 */
  .editable.auto-height {
    min-height: 44px;
    overflow: hidden;
    resize: none;
  }

  /* 复制按钮（图标） */
  .copy-btn {
    flex-shrink: 0;
    width: 44px;
    background: var(--primary-soft);
    border: none;
    border-radius: var(--r-md);
    color: var(--primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
  }
  .copy-btn:active { background: #DBEAFE; transform: scale(0.95); }
  .copy-btn svg { width: 18px; height: 18px; }

  /* Toast 提示 */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(17, 24, 39, 0.88);
    color: #fff;
    padding: 10px 18px;
    border-radius: var(--r-md);
    font-size: 14px;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* 确认弹窗 */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, 0.45);
    z-index: 9998;
    display: none;
    align-items: center;
    justify-content: center;
    padding: var(--s-4);
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--r-xl);
    width: 100%;
    max-width: 320px;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
  }
  .modal-title {
    padding: 24px 20px 8px;
    text-align: center;
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
  }
  .modal-desc {
    padding: 0 20px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
  }
  .modal-btns {
    display: flex;
    border-top: 1px solid var(--border);
  }
  .modal-btns button {
    flex: 1;
    background: transparent;
    border: none;
    padding: 14px 0;
    font-size: 16px;
    font-family: var(--font-body);
    cursor: pointer;
    transition: background 0.15s;
  }
  .modal-btns button:first-child {
    color: var(--text-muted);
    border-right: 1px solid var(--border);
  }
  .modal-btns button:last-child {
    color: var(--danger);
    font-weight: 500;
  }
  .modal-btns button:active { background: var(--neutral-100); }
</style>
</head>
<body>

<!-- ============ 主页面 ============ -->
<div id="home">
  <div class="search-card">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="搜索">
      <button class="search-clear" id="searchClear" aria-label="清除">×</button>
    </div>
  </div>

  <div class="list-scroll" id="listScroll"></div>

  <button class="fab-add" id="fabAdd" aria-label="新建">+</button>
</div>

<!-- ============ 编辑页面 ============ -->
<div id="editor">
  <div class="editor-header">
    <button class="header-btn back" id="backBtn" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <div class="header-title" id="editorTitle">新建</div>
    <button class="header-btn delete" id="deleteBtn" aria-label="删除">×</button>
  </div>

  <div class="editor-scroll">
    <div class="field-group">
      <label class="field-label">标题</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="title" data-singleline="1"></div></div>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">账号</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="account" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="account" aria-label="复制账号">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">密码</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="password" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="password" aria-label="复制密码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">手机</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="phone" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="phone" aria-label="复制手机">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">邮箱</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="email" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="email" aria-label="复制邮箱">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">初始密码</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="initPassword" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="initPassword" aria-label="复制初始密码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">注意事项</label>
      <div class="field-row">
        <div class="input-box"><div class="editable auto-height" data-field="notes"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-title">确认删除</div>
    <div class="modal-desc">删除后无法恢复，确定要删除吗？</div>
    <div class="modal-btns">
      <button id="cancelDelete">取消</button>
      <button id="confirmDelete">删除</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var STORAGE_KEY = 'account_password_data_v1';
  var data = [];
  var currentEditId = null;
  var isDirty = false;

  // ============ 数据加载/保存 ============
  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : [];
    } catch (e) { data = []; }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { showToast('保存失败'); }
  }

  // ============ Toast ============
  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 1500);
  }

  // ============ 主页面列表渲染 ============
  function renderList(filter) {
    filter = filter || '';
    var scroll = document.getElementById('listScroll');
    var filtered = data.filter(function(item) {
      return !filter || (item.title && item.title.toLowerCase().indexOf(filter.toLowerCase()) >= 0);
    });

    if (filtered.length === 0) {
      var msg = filter ? '没有匹配的记录' : '点击下方 + 添加第一条记录';
      scroll.innerHTML =
        '<div class="empty-tip">' +
        '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>' +
        '<path d="M7 11V7a5 5 0 0 1 10 0v4"/>' +
        '</svg>' + msg + '</div>';
      return;
    }

    var html = '';
    filtered.forEach(function(item) {
      var safeTitle = escapeHtml(item.title || '未命名');
      html += '<div class="list-item" data-id="' + item.id + '">' +
              '<div class="title">' + safeTitle + '</div>' +
              '<div class="arrow">›</div>' +
              '</div>';
    });
    scroll.innerHTML = html;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ============ 搜索 ============
  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');

  searchInput.addEventListener('input', function() {
    var v = this.value;
    searchClear.classList.toggle('show', !!v);
    renderList(v);
  });

  searchClear.addEventListener('click', function() {
    searchInput.value = '';
    searchClear.classList.remove('show');
    renderList('');
  });

  // ============ 列表点击 ============
  document.getElementById('listScroll').addEventListener('click', function(e) {
    var item = e.target.closest('.list-item');
    if (!item) return;
    openEditor(item.getAttribute('data-id'));
  });

  // ============ 编辑页面 ============
  var editor = document.getElementById('editor');
  var home = document.getElementById('home');

  function openEditor(id) {
    currentEditId = id || null;
    var item;
    if (id) {
      item = data.filter(function(d) { return String(d.id) === String(id); })[0];
      if (!item) return;
      document.getElementById('editorTitle').textContent = item.title || '编辑';
      document.getElementById('deleteBtn').style.display = 'flex';
    } else {
      item = { title:'', account:'', password:'', phone:'', email:'', initPassword:'', notes:'' };
      document.getElementById('editorTitle').textContent = '新建';
      document.getElementById('deleteBtn').style.display = 'none';
    }

    document.querySelectorAll('.editable').forEach(function(el) {
      var field = el.getAttribute('data-field');
      el.textContent = item[field] || '';
      el.classList.remove('editing');
      if (el.classList.contains('auto-height')) autoGrow(el);
    });

    isDirty = false;
    editor.classList.add('slide-in');
    home.classList.add('slide-out');
  }

  function closeEditor() {
    if (isDirty) saveCurrent();
    editor.classList.remove('slide-in');
    editor.classList.add('slide-out');
    home.classList.remove('slide-out');
    setTimeout(function() {
      editor.classList.remove('slide-out');
      isDirty = false;
    }, 360);
  }

  document.getElementById('backBtn').addEventListener('click', closeEditor);

  // ============ 删除 ============
  document.getElementById('deleteBtn').addEventListener('click', function() {
    document.getElementById('modalMask').classList.add('show');
  });
  document.getElementById('cancelDelete').addEventListener('click', function() {
    document.getElementById('modalMask').classList.remove('show');
  });
  document.getElementById('confirmDelete').addEventListener('click', function() {
    document.getElementById('modalMask').classList.remove('show');
    if (currentEditId) {
      data = data.filter(function(d) { return String(d.id) !== String(currentEditId); });
      saveData();
      renderList(searchInput.value);
      isDirty = false;
      closeEditor();
      showToast('已删除');
    }
  });

  // ============ 文本编辑框：双击编辑（兼容手机触屏与电脑鼠标） ============
  function enterEdit(el) {
    el.classList.add('editing');
    el.contentEditable = 'true';
    el.focus();
    var range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  document.querySelectorAll('.editable').forEach(function(el) {
    var lastTap = 0;
    var tapTimeout = null;

    function handleTap() {
      var now = Date.now();
      if (now - lastTap < 300) {
        if (tapTimeout) { clearTimeout(tapTimeout); tapTimeout = null; }
        lastTap = 0;
        enterEdit(el);
        return;
      }
      lastTap = now;
      if (tapTimeout) clearTimeout(tapTimeout);
      tapTimeout = setTimeout(function() { tapTimeout = null; lastTap = 0; }, 300);
    }

    el.addEventListener('dblclick', function(e) { e.preventDefault(); enterEdit(el); });
    el.addEventListener('touchend', function(e) { e.preventDefault(); handleTap(); });

    el.addEventListener('blur', function() {
      el.contentEditable = 'false';
      el.classList.remove('editing');
      if (el.classList.contains('auto-height')) autoGrow(el);
      markDirty();
    });

    if (el.getAttribute('data-singleline') === '1') {
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      });
      el.addEventListener('paste', function(e) {
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text');
        text = text.replace(/[\r\n]+/g, ' ');
        document.execCommand('insertText', false, text);
      });
    }

    if (el.classList.contains('auto-height')) {
      el.addEventListener('input', function() { autoGrow(el); });
    }
  });

  function autoGrow(el) {
    el.style.height = 'auto';
    var newHeight = Math.max(el.scrollHeight, 44);
    el.style.height = newHeight + 'px';
  }

  function markDirty() { isDirty = true; }

  // ============ 复制按钮 ============
  document.querySelectorAll('.copy-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var field = btn.getAttribute('data-copy');
      var el = document.querySelector('.editable[data-field="' + field + '"]');
      var text = el ? el.textContent : '';
      if (!text) { showToast('内容为空'); return; }
      copyText(text, function(ok) { showToast(ok ? '已复制' : '复制失败'); });
    });
  });

  function copyText(text, cb) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() { cb(true); }).catch(function() { fallbackCopy(text, cb); });
    } else { fallbackCopy(text, cb); }
  }

  function fallbackCopy(text, cb) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      cb(ok);
    } catch (e) { cb(false); }
  }

  // ============ 保存当前编辑内容 ============
  function saveCurrent() {
    var item = {};
    document.querySelectorAll('.editable').forEach(function(el) {
      var field = el.getAttribute('data-field');
      item[field] = el.textContent;
    });

    if (!item.title || !item.title.trim()) return false;

    if (currentEditId) {
      for (var i = 0; i < data.length; i++) {
        if (String(data[i].id) === String(currentEditId)) {
          data[i] = Object.assign(data[i], item);
          break;
        }
      }
    } else {
      item.id = Date.now() + '' + Math.floor(Math.random() * 1000);
      item.createTime = Date.now();
      data.push(item);
      currentEditId = item.id;
    }

    saveData();
    renderList(searchInput.value);
    return true;
  }

  // ============ 添加按钮 ============
  document.getElementById('fabAdd').addEventListener('click', function() {
    openEditor(null);
  });

  // ============ Android 返回键支持 ============
  window.addEventListener('popstate', function() {
    if (editor.classList.contains('slide-in')) {
      closeEditor();
      history.pushState(null, '', location.href);
    }
  });

  // ============ 初始化 ============
  loadData();
  renderList();

  // 防止双击放大（iOS）
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

})();
</script>
</body>
</html>
