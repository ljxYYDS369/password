<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✦ 账号密码</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --primary: #3B82F6;
  --primary-glow: rgba(59, 130, 246, 0.35);
  --secondary: #8B5CF6;
  --secondary-glow: rgba(139, 92, 246, 0.4);
  --danger: #DC2626;
  --bg: #08081A;
  --bg-card: #0E0E24;
  --bg-elevated: #161638;
  --border: rgba(139, 92, 246, 0.15);
  --border-active: #8B5CF6;
  --text: #E8E8F5;
  --text-dim: rgba(232, 232, 245, 0.3);
  --text-muted: rgba(232, 232, 245, 0.5);
  --font-display: 'Audiowide', sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
}

body {
  font-family: var(--font-mono);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  position: relative;
}

/* ===== Cosmic particles overlay ===== */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(139,92,246,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 30% 60%, rgba(59,130,246,0.4) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 50% 10%, rgba(139,92,246,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 70% 40%, rgba(59,130,246,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 80%, rgba(139,92,246,0.5) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 20% 90%, rgba(59,130,246,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 15%, rgba(139,92,246,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 45% 75%, rgba(59,130,246,0.5) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

/* ===== Container & Views ===== */
#app {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 1;
}

.view {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

#listView {
  z-index: 1;
  transform: translateX(0);
  background: transparent;
}

#editView {
  z-index: 2;
  transform: translateX(100%);
  background: var(--bg);
}

#editView.active {
  transform: translateX(0);
}

/* ===== Header ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(14, 14, 36, 0.92);
  backdrop-filter: blur(12px);
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.header h1 {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 400;
  color: var(--secondary);
  letter-spacing: 4px;
  padding: 6px 0 2px;
  text-shadow: 0 0 20px var(--secondary-glow), 0 0 60px rgba(139,92,246,0.15);
}

.header h1::before {
  content: '◇ ';
  color: var(--primary);
  text-shadow: 0 0 12px var(--primary-glow);
}

.searchWrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

.searchBox {
  flex: 1;
  position: relative;
}

.searchBox input {
  width: 100%;
  height: 40px;
  padding: 0 12px 0 38px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-elevated);
  font-family: var(--font-mono);
  font-size: 12px;
  outline: none;
  color: var(--text);
  transition: border-color 0.25s, box-shadow 0.25s;
}

.searchBox input::placeholder {
  color: var(--text-dim);
}

.searchBox input:focus {
  border-color: var(--secondary);
  box-shadow: 0 0 20px var(--secondary-glow), inset 0 0 20px rgba(139,92,246,0.04);
}

.searchBox .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  pointer-events: none;
  opacity: 0.3;
  color: var(--secondary);
}

/* ===== Count badge ===== */
.count-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  padding: 2px 0 4px 16px;
  letter-spacing: 1.5px;
}

.count-badge span {
  color: var(--secondary);
  text-shadow: 0 0 8px var(--secondary-glow);
}

/* ===== List ===== */
.listWrap {
  padding: 0;
  min-height: calc(100vh - 60px);
  padding-bottom: 100px;
}

.emptyState {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--text-dim);
}

.emptyState .emptyIcon {
  font-size: 44px;
  margin-bottom: 12px;
  opacity: 0.3;
}

.emptyState p {
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  letter-spacing: 1px;
}

.listItem {
  display: flex;
  align-items: center;
  padding: 16px 16px;
  background: rgba(14, 14, 36, 0.6);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
  position: relative;
  backdrop-filter: blur(4px);
}

.listItem::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: transparent;
  transition: background 0.25s, box-shadow 0.25s;
}

.listItem:active {
  background: rgba(22, 22, 56, 0.8);
  border-color: rgba(139,92,246,0.25);
}

.listItem:active::before {
  background: var(--secondary);
  box-shadow: 0 0 16px var(--secondary-glow);
}

.listItem .avatar {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  background: rgba(139, 92, 246, 0.1);
  border: 1px solid rgba(139, 92, 246, 0.2);
  color: var(--secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 15px;
  margin-right: 14px;
  flex-shrink: 0;
  text-shadow: 0 0 10px var(--secondary-glow);
  box-shadow: 0 0 10px rgba(139,92,246,0.06), inset 0 0 10px rgba(139,92,246,0.04);
}

.listItem .info {
  flex: 1;
  min-width: 0;
}

.listItem .title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.5px;
  font-family: var(--font-mono);
}

.listItem .sub {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-dim);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.listItem .sub::before {
  content: '▸ ';
  color: var(--primary);
  opacity: 0.5;
}

/* ===== FAB ===== */
.add-btn {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: rgba(22, 22, 56, 0.9);
  border: 2px solid var(--secondary);
  color: var(--secondary);
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 400;
  box-shadow: 0 0 24px var(--secondary-glow), inset 0 0 24px rgba(139,92,246,0.06);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99;
  transition: transform 0.2s, box-shadow 0.25s, background 0.2s;
  backdrop-filter: blur(8px);
}

.add-btn:active {
  transform: translateX(-50%) scale(0.92);
  background: rgba(139, 92, 246, 0.12);
  box-shadow: 0 0 40px var(--secondary-glow), inset 0 0 30px rgba(139,92,246,0.08);
}

/* ===== Edit Header ===== */
.editHeader {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  background: rgba(14, 14, 36, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.editHeader .backBtn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--primary);
  cursor: pointer;
  border-radius: 6px;
  flex-shrink: 0;
  margin-right: 10px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.editHeader .backBtn:active {
  border-color: var(--primary);
  box-shadow: 0 0 12px var(--primary-glow);
}

.editHeader .editTitle {
  flex: 1;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.editHeader .delBtn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(220, 38, 38, 0.2);
  background: var(--bg-elevated);
  font-size: 14px;
  color: var(--danger);
  cursor: pointer;
  border-radius: 6px;
  flex-shrink: 0;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.editHeader .delBtn:active {
  border-color: var(--danger);
  box-shadow: 0 0 12px rgba(220, 38, 38, 0.25);
}

/* ===== Edit Body ===== */
.editBody {
  padding: 20px 16px 100px;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 6px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.form-group label::before {
  content: '# ';
  color: var(--secondary);
  opacity: 0.4;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-elevated);
  font-family: var(--font-mono);
  font-size: 13px;
  outline: none;
  color: var(--text);
  transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: var(--secondary);
  background: rgba(139, 92, 246, 0.04);
  box-shadow: 0 0 20px var(--secondary-glow), inset 0 0 20px rgba(139,92,246,0.03);
}

.form-group input::placeholder,
.form-group textarea::placeholder {
  color: var(--text-dim);
  font-size: 11px;
  letter-spacing: 0.5px;
}

.form-group textarea {
  min-height: 80px;
  resize: vertical;
  line-height: 1.6;
}

/* ===== Field row ===== */
.field-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.field-row input {
  flex: 1;
}

/* 密码遮罩：不触发安全键盘 */
.pwd-input {
  -webkit-text-security: disc;
  text-security: disc;
}

.field-row .action-btn {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--text-dim);
  transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
}

.field-row .action-btn:active {
  border-color: var(--primary);
  color: var(--primary);
  box-shadow: 0 0 10px var(--primary-glow);
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.85);
  background: var(--bg-elevated);
  color: var(--secondary);
  padding: 12px 24px;
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
  white-space: nowrap;
  border: 1px solid rgba(139,92,246,0.2);
  box-shadow: 0 0 24px var(--secondary-glow);
  letter-spacing: 1px;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* ===== Confirm ===== */
.confirm-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.confirm-overlay.active {
  display: flex;
}

.confirm-modal {
  background: var(--bg-card);
  border-radius: 8px;
  border: 1px solid rgba(220, 38, 38, 0.15);
  width: 100%;
  max-width: 300px;
  padding: 28px 20px 20px;
  text-align: center;
  box-shadow: 0 0 30px rgba(220, 38, 38, 0.06);
}

.confirm-modal p {
  font-size: 13px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  margin-bottom: 24px;
  line-height: 1.6;
  letter-spacing: 0.5px;
}

.confirm-modal p::before {
  content: '⚠ ';
  color: var(--danger);
}

.confirm-actions {
  display: flex;
  gap: 12px;
}

.confirm-actions .btn {
  flex: 1;
  padding: 12px;
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: all 0.2s;
  letter-spacing: 0.5px;
}

.confirm-actions .btn:active {
  transform: scale(0.97);
}

.confirm-actions .btn-cancel {
  background: var(--bg-elevated);
  color: var(--text-muted);
}

.confirm-actions .btn-cancel:active {
  border-color: var(--text-dim);
}

.confirm-actions .btn-delete {
  background: rgba(220, 38, 38, 0.08);
  border-color: rgba(220, 38, 38, 0.25);
  color: var(--danger);
  box-shadow: 0 0 8px rgba(220, 38, 38, 0.08);
}

.confirm-actions .btn-delete:active {
  background: rgba(220, 38, 38, 0.15);
  box-shadow: 0 0 16px rgba(220, 38, 38, 0.15);
}

/* ===== Swipe hint ===== */
.swipeHint {
  position: fixed;
  top: 50%;
  left: 0;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  padding: 8px 12px;
  background: rgba(14, 14, 36, 0.9);
  border: 1px solid var(--border);
  border-left: none;
  border-radius: 0 6px 6px 0;
  box-shadow: 0 0 12px rgba(59,130,246,0.08);
  z-index: 5;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  letter-spacing: 1px;
  backdrop-filter: blur(4px);
}

.swipeHint.show {
  opacity: 1;
}

/* ===== Scrollbar ===== */
.view::-webkit-scrollbar {
  width: 3px;
}

.view::-webkit-scrollbar-track {
  background: transparent;
}

.view::-webkit-scrollbar-thumb {
  background: rgba(139,92,246,0.2);
  border-radius: 2px;
}
</style>
</head>
<body>

<div id="app">
  <!-- ========== LIST VIEW ========== -->
  <div id="listView" class="view">
    <div class="header">
      <div class="searchWrap">
        <div class="searchBox">
          <span class="icon">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索标题..." autocomplete="off">
        </div>
      </div>
      <h1>账号密码</h1>
      <div class="count-badge">记录: <span id="recordCount">0</span></div>
    </div>
    <div class="listWrap" id="listWrap"></div>
  </div>

  <!-- ========== EDIT VIEW ========== -->
  <div id="editView" class="view">
    <div class="editHeader">
      <button class="backBtn" id="backBtn">◀</button>
      <span class="editTitle" id="editTitle">编辑</span>
      <button class="delBtn" id="delBtn">✕</button>
    </div>
    <div class="editBody" id="editBody">
      <div class="form-group">
        <label>标题</label>
        <input id="f_title" type="text" placeholder="例如：GitHub">
      </div>
      <div class="form-group">
        <div class="field-row">
          <input id="f_account" type="text" placeholder="账号">
          <button class="action-btn" data-field="account" title="复制">⎘</button>
        </div>
      </div>
      <div class="form-group">
        <div class="field-row">
          <input id="f_password" type="text" placeholder="密码" class="pwd-input">
          <button class="action-btn" data-field="password" title="复制">⎘</button>
        </div>
      </div>
      <div class="form-group">
        <div class="field-row">
          <input id="f_phone" type="text" placeholder="手机">
          <button class="action-btn" data-field="phone" title="复制">⎘</button>
        </div>
      </div>
      <div class="form-group">
        <div class="field-row">
          <input id="f_email" type="email" placeholder="邮箱">
          <button class="action-btn" data-field="email" title="复制">⎘</button>
        </div>
      </div>
      <div class="form-group">
        <div class="field-row">
          <input id="f_initialPwd" type="text" placeholder="初始密码" class="pwd-input">
          <button class="action-btn" data-field="initialPwd" title="复制">⎘</button>
        </div>
      </div>
      <div class="form-group">
        <textarea id="f_notes" placeholder="注意事项" rows="1"></textarea>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <button class="add-btn" id="fab">✦</button>

  <!-- delete confirm -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-modal">
      <p>确定要删除这条记录吗？</p>
      <div class="confirm-actions">
        <button class="btn btn-cancel" id="confirmCancel">取消</button>
        <button class="btn btn-delete" id="confirmOk">删除</button>
      </div>
    </div>
  </div>

  <!-- toast -->
  <div class="toast" id="toast"></div>
</div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = '_acct_vault_';
  let items = [];
  let currentId = null;
  let scrollPos = 0;

  var listView = document.getElementById('listView');
  var editView = document.getElementById('editView');
  var listWrap = document.getElementById('listWrap');
  var searchInput = document.getElementById('searchInput');
  var fab = document.getElementById('fab');
  var backBtn = document.getElementById('backBtn');
  var delBtn = document.getElementById('delBtn');
  var editTitle = document.getElementById('editTitle');
  var recordCount = document.getElementById('recordCount');
  var confirmOverlay = document.getElementById('confirmOverlay');
  var confirmCancel = document.getElementById('confirmCancel');
  var confirmOk = document.getElementById('confirmOk');
  var toast = document.getElementById('toast');

  var ff = {
    title: document.getElementById('f_title'),
    account: document.getElementById('f_account'),
    password: document.getElementById('f_password'),
    phone: document.getElementById('f_phone'),
    email: document.getElementById('f_email'),
    initialPwd: document.getElementById('f_initialPwd'),
    notes: document.getElementById('f_notes'),
  };

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      items = raw ? JSON.parse(raw) : [];
    } catch (e) { items = []; }
    if (!Array.isArray(items)) items = [];
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  var toastTimer = null;
  function showToast(msg) {
    toast.textContent = '> ' + msg;
    toast.className = 'toast show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.className = 'toast'; }, 1500);
  }

  function getFiltered() {
    var q = searchInput.value.trim().toLowerCase();
    if (!q) return items.slice();
    return items.filter(function (item) {
      return item.title && item.title.toLowerCase().includes(q);
    });
  }

  function getItemIndexById(id) {
    return items.findIndex(function (item) { return item.id === id; });
  }

  function renderList() {
    var filtered = getFiltered();
    recordCount.textContent = filtered.length;

    if (filtered.length === 0) {
      listWrap.innerHTML = items.length === 0
        ? '<div class="emptyState"><div class="emptyIcon">◇</div><p>暂无记录 // 点击 + 添加</p></div>'
        : '<div class="emptyState"><div class="emptyIcon">⌕</div><p>没有匹配的记录 // 换个关键词试试</p></div>';
      return;
    }
    var html = '';
    for (var i = 0; i < filtered.length; i++) {
      var item = filtered[i];
      var firstChar = item.title ? item.title.charAt(0).toUpperCase() : '?';
      var sub = item.account || '';
      html += '<div class="listItem" data-id="' + item.id + '">'
        + '<div class="avatar">' + firstChar + '</div>'
        + '<div class="info">'
        + '<div class="title">' + escHtml(item.title || '未命名') + '</div>'
        + '<div class="sub">' + escHtml(sub) + '</div>'
        + '</div>'
        + '</div>';
    }
    listWrap.innerHTML = html;

    var items_el = listWrap.querySelectorAll('.listItem');
    for (var j = 0; j < items_el.length; j++) {
      items_el[j].addEventListener('click', function () {
        openEdit(this.dataset.id);
      });
    }
  }

  function escHtml(str) {
    if (!str) return '';
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function openEdit(id) {
    scrollPos = listView.scrollTop;

    if (id === '__new__') {
      currentId = '__new__';
      ff.title.value = '';
      ff.account.value = '';
      ff.password.value = '';
      ff.phone.value = '';
      ff.email.value = '';
      ff.initialPwd.value = '';
      ff.notes.value = '';
      editTitle.textContent = '新建';
      editView.className = 'view active';
      editView.scrollTop = 0;
      fab.style.display = 'none';
      return;
    }
    var idx = getItemIndexById(id);
    if (idx === -1) return;
    currentId = id;
    var item = items[idx];
    ff.title.value = item.title || '';
    ff.account.value = item.account || '';
    ff.password.value = item.password || '';
    ff.phone.value = item.phone || '';
    ff.email.value = item.email || '';
    ff.initialPwd.value = item.initialPwd || '';
    ff.notes.value = item.notes || '';
    editTitle.textContent = item.title || '编辑';
    editView.className = 'view active';
    editView.scrollTop = 0;
    fab.style.display = 'none';
  }

  function closeEdit(restoreScroll) {
    saveCurrentEdit();
    editView.className = 'view';
    currentId = null;
    fab.style.display = '';
    if (restoreScroll !== false) {
      requestAnimationFrame(function () {
        listView.scrollTop = scrollPos;
      });
    }
    renderList();
  }

  function saveCurrentEdit() {
    if (currentId === null) return;

    // 新建模式：有内容时才真正创建
    if (currentId === '__new__') {
      var hasContent = ff.title.value.trim()
        || ff.account.value.trim()
        || ff.password.value
        || ff.phone.value.trim()
        || ff.email.value.trim()
        || ff.initialPwd.value
        || ff.notes.value.trim();
      if (!hasContent) return;

      var newItem = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        title: ff.title.value.trim(),
        account: ff.account.value.trim(),
        password: ff.password.value,
        phone: ff.phone.value.trim(),
        email: ff.email.value.trim(),
        initialPwd: ff.initialPwd.value,
        notes: ff.notes.value,
      };
      items.unshift(newItem);
      currentId = newItem.id;
      saveData();
      return;
    }

    var idx = getItemIndexById(currentId);
    if (idx === -1) return;
    var item = items[idx];
    item.title = ff.title.value.trim();
    item.account = ff.account.value.trim();
    item.password = ff.password.value;
    item.phone = ff.phone.value.trim();
    item.email = ff.email.value.trim();
    item.initialPwd = ff.initialPwd.value;
    item.notes = ff.notes.value;
    saveData();
  }

  function addNew() {
    openEdit('__new__');
  }

  var pendingDeleteId = null;

  function confirmDelete() {
    if (currentId === null) return;
    pendingDeleteId = currentId;
    confirmOverlay.className = 'confirm-overlay active';
  }

  confirmCancel.addEventListener('click', function () {
    confirmOverlay.className = 'confirm-overlay';
    pendingDeleteId = null;
  });

  confirmOk.addEventListener('click', function () {
    confirmOverlay.className = 'confirm-overlay';
    if (pendingDeleteId !== null) {
      var idx = getItemIndexById(pendingDeleteId);
      if (idx !== -1) {
        items.splice(idx, 1);
        saveData();
      }
      pendingDeleteId = null;
      editView.className = 'view';
      currentId = null;
      renderList();
      requestAnimationFrame(function () {
        listView.scrollTop = scrollPos;
      });
      showToast('已删除');
    }
  });

  fab.addEventListener('click', addNew);
  backBtn.addEventListener('click', function () { closeEdit(true); });
  delBtn.addEventListener('click', confirmDelete);

  searchInput.addEventListener('input', function () { renderList(); });


  var copyBtns = document.querySelectorAll('.action-btn[data-field]');
  for (var c = 0; c < copyBtns.length; c++) {
    copyBtns[c].addEventListener('click', function () {
      var field = this.dataset.field;
      var val = ff[field] ? ff[field].value : '';
      if (!val) { showToast('内容为空'); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).then(function () {
          showToast('已复制');
        }).catch(function () {
          fallbackCopy(val);
        });
      } else {
        fallbackCopy(val);
      }
    });
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('已复制');
    } catch (e) {
      showToast('复制失败');
    }
    document.body.removeChild(ta);
  }

  var fieldKeys = Object.keys(ff);
  for (var k = 0; k < fieldKeys.length; k++) {
    (function (key) {
      ff[key].addEventListener('input', function () {
        if (currentId !== null) {
          saveCurrentEdit();
          var idx = getItemIndexById(currentId);
          if (idx !== -1) {
            editTitle.textContent = (items[idx].title || 'EDIT').toUpperCase();
          }
        }
      });
    })(fieldKeys[k]);
  }

  // 备注文本框自动增长
  ff.notes.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = this.scrollHeight + 'px';
  });

  loadData();
  renderList();
})();
</script>
</body>
</html>
