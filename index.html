<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>账号密码管理</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f0f2f5;
    --card-bg: #ffffff;
    --primary: #4a7cf7;
    --text-main: #1a1a1a;
    --text-sub: #666;
    --border: #e8e8e8;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text-main);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 主页面 ============ */
  #home {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
  }

  #home.slide-out {
    transform: translateX(-25%);
  }

  /* 顶部搜索卡片 */
  .search-card {
    flex-shrink: 0;
    background: var(--card-bg);
    padding: calc(var(--safe-top) + 12px) 16px 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    position: relative;
    z-index: 10;
  }

  .search-wrap {
    display: flex;
    align-items: center;
    background: #f5f5f5;
    border-radius: 24px;
    padding: 0 16px;
    height: 44px;
  }

  .search-icon {
    width: 18px;
    height: 18px;
    margin-right: 8px;
    opacity: 0.5;
    flex-shrink: 0;
  }

  .search-wrap input {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-size: 15px;
    color: var(--text-main);
    min-width: 0;
  }

  .search-wrap input::placeholder {
    color: #999;
  }

  .search-clear {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ccc;
    color: #fff;
    border: none;
    font-size: 12px;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
    flex-shrink: 0;
    display: none;
  }
  .search-clear.show { display: block; }

  /* 列表滚动区 */
  .list-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 0 calc(var(--safe-bottom) + 20px);
  }

  .list-item {
    background: var(--card-bg);
    margin: 0 12px 10px;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .list-item:active {
    background: #f5f5f5;
    transform: scale(0.98);
  }

  .list-item .title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-main);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .list-item .arrow {
    color: #ccc;
    font-size: 20px;
    flex-shrink: 0;
    margin-left: 8px;
  }

  .empty-tip {
    text-align: center;
    color: #999;
    padding: 60px 20px;
    font-size: 14px;
  }

  /* 添加按钮：底部居中 */
  .fab-add {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-bottom) + 20px);
    transform: translateX(-50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    font-size: 30px;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(74, 124, 247, 0.4);
    cursor: pointer;
    z-index: 20;
    line-height: 1;
  }
  .fab-add:active { transform: translateX(-50%) scale(0.9); }

  /* ============ 编辑页面 ============ */
  #editor {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
    visibility: hidden;
  }

  #editor.slide-in {
    transform: translateX(0);
    visibility: visible;
  }

  #editor.slide-out {
    transform: translateX(100%);
    visibility: visible;
  }

  /* 编辑页顶部卡片 */
  .editor-header {
    flex-shrink: 0;
    background: var(--card-bg);
    padding: calc(var(--safe-top) + 12px) 16px 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 10;
  }

  .header-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    color: var(--text-main);
    font-size: 15px;
  }
  .header-btn:active { opacity: 0.6; }

  .header-btn.back svg { width: 22px; height: 22px; }

  .header-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-main);
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .header-btn.delete {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    color: #ff3b30;
    font-size: 26px;
    line-height: 1;
    justify-content: center;
    align-items: center;
    font-weight: 300;
  }

  /* 编辑页内容滚动区 */
  .editor-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 0 calc(var(--safe-bottom) + 80px);
  }

  .field-group {
    background: var(--card-bg);
    margin: 0 12px 12px;
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
  }

  .field-label {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 8px;
    display: block;
  }

  .field-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }

  .field-row .input-box {
    flex: 1;
    min-width: 0;
  }

  /* 文本编辑框 */
  .editable {
    background: #f5f5f5;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    color: var(--text-main);
    line-height: 1.5;
    min-height: 42px;
    word-break: break-all;
    white-space: pre-wrap;
    cursor: pointer;
    user-select: text;
    -webkit-user-select: text;
    transition: background 0.15s, box-shadow 0.15s;
  }

  .editable:empty::before {
    content: "";
  }

  .editable.editing {
    background: #fff;
    box-shadow: 0 0 0 2px var(--primary);
    cursor: text;
    outline: none;
  }

  /* 注意事项文本框：自适应高度，固定最小高度 */
  .editable.auto-height {
    min-height: 42px;
    overflow: hidden;
    resize: none;
  }

  /* 复制按钮 */
  .copy-btn {
    flex-shrink: 0;
    width: 42px;
    background: #eef2ff;
    border: none;
    border-radius: 8px;
    color: var(--primary);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: background 0.15s;
  }
  .copy-btn:active { background: #dbe4ff; }
  .copy-btn svg { width: 16px; height: 16px; }


  /* Toast 提示 */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.78);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* 确认弹窗 */
  .modal-mask {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    z-index: 9998;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    width: 80%;
    max-width: 300px;
    overflow: hidden;
  }
  .modal-title {
    padding: 20px 20px 10px;
    text-align: center;
    font-size: 16px;
    font-weight: 500;
  }
  .modal-desc {
    padding: 0 20px 20px;
    text-align: center;
    color: #666;
    font-size: 14px;
  }
  .modal-btns {
    display: flex;
    border-top: 1px solid #eee;
  }
  .modal-btns button {
    flex: 1;
    background: transparent;
    border: none;
    padding: 13px 0;
    font-size: 16px;
    cursor: pointer;
  }
  .modal-btns button:first-child { color: #666; border-right: 1px solid #eee; }
  .modal-btns button:last-child { color: #ff3b30; font-weight: 500; }
  .modal-btns button:active { background: #f5f5f5; }
</style>
</head>
<body>

<!-- ============ 主页面 ============ -->
<div id="home">
  <div class="search-card">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="搜索标题">
      <button class="search-clear" id="searchClear">×</button>
    </div>
  </div>

  <div class="list-scroll" id="listScroll"></div>

  <button class="fab-add" id="fabAdd">+</button>
</div>

<!-- ============ 编辑页面 ============ -->
<div id="editor">
  <div class="editor-header">
    <button class="header-btn back" id="backBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <div class="header-title" id="editorTitle">新建</div>
    <button class="header-btn delete" id="deleteBtn">×</button>
  </div>

  <div class="editor-scroll">
    <div class="field-group">
      <label class="field-label">标题</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="title" data-singleline="1"></div></div>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">账号</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="account" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="account">复制</button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">密码</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="password" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="password">复制</button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">手机</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="phone" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="phone">复制</button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">邮箱</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="email" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="email">复制</button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">初始密码</label>
      <div class="field-row">
        <div class="input-box"><div class="editable" data-field="initPassword" data-singleline="1"></div></div>
        <button class="copy-btn" data-copy="initPassword">复制</button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">注意事项</label>
      <div class="field-row">
        <div class="input-box"><div class="editable auto-height" data-field="notes"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-title">确认删除</div>
    <div class="modal-desc">删除后无法恢复，确定要删除吗？</div>
    <div class="modal-btns">
      <button id="cancelDelete">取消</button>
      <button id="confirmDelete">删除</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var STORAGE_KEY = 'account_password_data_v1';
  var data = [];
  var currentEditId = null;
  var isDirty = false;

  // ============ 数据加载/保存 ============
  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : [];
    } catch (e) {
      data = [];
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      showToast('保存失败');
    }
  }

  // ============ Toast ============
  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 1500);
  }

  // ============ 主页面列表渲染 ============
  function renderList(filter) {
    filter = filter || '';
    var scroll = document.getElementById('listScroll');
    var filtered = data.filter(function(item) {
      return !filter || (item.title && item.title.toLowerCase().indexOf(filter.toLowerCase()) >= 0);
    });

    if (filtered.length === 0) {
      scroll.innerHTML = '<div class="empty-tip">' + (filter ? '没有匹配的记录' : '点击右下角 + 添加第一条记录') + '</div>';
      return;
    }

    var html = '';
    filtered.forEach(function(item) {
      var safeTitle = escapeHtml(item.title || '未命名');
      html += '<div class="list-item" data-id="' + item.id + '">' +
              '<div class="title">' + safeTitle + '</div>' +
              '<div class="arrow">›</div>' +
              '</div>';
    });
    scroll.innerHTML = html;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ============ 搜索 ============
  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');

  searchInput.addEventListener('input', function() {
    var v = this.value;
    searchClear.classList.toggle('show', !!v);
    renderList(v);
  });

  searchClear.addEventListener('click', function() {
    searchInput.value = '';
    searchClear.classList.remove('show');
    renderList('');
  });

  // ============ 列表点击 ============
  document.getElementById('listScroll').addEventListener('click', function(e) {
    var item = e.target.closest('.list-item');
    if (!item) return;
    openEditor(item.getAttribute('data-id'));
  });

  // ============ 编辑页面 ============
  var editor = document.getElementById('editor');
  var home = document.getElementById('home');

  function openEditor(id) {
    currentEditId = id || null;
    var item;
    if (id) {
      item = data.filter(function(d) { return String(d.id) === String(id); })[0];
      if (!item) return;
      document.getElementById('editorTitle').textContent = item.title || '编辑';
      document.getElementById('deleteBtn').style.display = 'flex';
    } else {
      item = { title:'', account:'', password:'', phone:'', email:'', initPassword:'', notes:'' };
      document.getElementById('editorTitle').textContent = '新建';
      document.getElementById('deleteBtn').style.display = 'none';
    }

    // 填充编辑框
    document.querySelectorAll('.editable').forEach(function(el) {
      var field = el.getAttribute('data-field');
      el.textContent = item[field] || '';
      el.classList.remove('editing');
      if (el.classList.contains('auto-height')) {
        autoGrow(el);
      }
    });

    isDirty = false;

    // 滑入动画
    editor.classList.add('slide-in');
    home.classList.add('slide-out');
  }

  function closeEditor() {
    // 返回时自动保存
    if (isDirty) {
      saveCurrent();
    }
    editor.classList.remove('slide-in');
    editor.classList.add('slide-out');
    home.classList.remove('slide-out');

    setTimeout(function() {
      editor.classList.remove('slide-out');
      isDirty = false;
    }, 360);
  }

  document.getElementById('backBtn').addEventListener('click', closeEditor);

  // ============ 删除 ============
  document.getElementById('deleteBtn').addEventListener('click', function() {
    document.getElementById('modalMask').classList.add('show');
  });

  document.getElementById('cancelDelete').addEventListener('click', function() {
    document.getElementById('modalMask').classList.remove('show');
  });

  document.getElementById('confirmDelete').addEventListener('click', function() {
    document.getElementById('modalMask').classList.remove('show');
    if (currentEditId) {
      data = data.filter(function(d) { return String(d.id) !== String(currentEditId); });
      saveData();
      renderList(searchInput.value);
      isDirty = false;
      closeEditor();
      showToast('已删除');
    }
  });

  // ============ 文本编辑框：双击编辑（兼容手机触屏与电脑鼠标） ============
  function enterEdit(el) {
    el.classList.add('editing');
    el.contentEditable = 'true';
    el.focus();
    // 移动光标到末尾
    var range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  document.querySelectorAll('.editable').forEach(function(el) {
    // 双击检测：记录最近两次点击时间，300ms 内两次点击视为双击
    var lastTap = 0;
    var tapTimeout = null;

    function handleTap() {
      var now = Date.now();
      if (now - lastTap < 300) {
        // 双击
        if (tapTimeout) { clearTimeout(tapTimeout); tapTimeout = null; }
        lastTap = 0;
        enterEdit(el);
        return;
      }
      // 单击：延迟 300ms 确认（等待可能的第二次点击）
      lastTap = now;
      if (tapTimeout) clearTimeout(tapTimeout);
      tapTimeout = setTimeout(function() {
        tapTimeout = null;
        lastTap = 0;
      }, 300);
    }

    // 电脑鼠标双击
    el.addEventListener('dblclick', function(e) {
      e.preventDefault();
      enterEdit(el);
    });

    // 手机触摸双击（touchend 比 click 更灵敏，避免 300ms 延迟）
    el.addEventListener('touchend', function(e) {
      // 阻止后续 click 事件触发，避免与 dblclick 重复
      e.preventDefault();
      handleTap();
    });

    el.addEventListener('blur', function() {
      el.contentEditable = 'false';
      el.classList.remove('editing');
      if (el.classList.contains('auto-height')) {
        autoGrow(el);
      }
      markDirty();
    });

    // 单行输入框：阻止回车换行
    if (el.getAttribute('data-singleline') === '1') {
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          el.blur();
        }
      });
      // 粘贴时去除换行
      el.addEventListener('paste', function(e) {
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text');
        text = text.replace(/[\r\n]+/g, ' ');
        document.execCommand('insertText', false, text);
      });
    }

    // 注意事项框：输入时自适应高度
    if (el.classList.contains('auto-height')) {
      el.addEventListener('input', function() {
        autoGrow(el);
      });
    }
  });

  function autoGrow(el) {
    el.style.height = 'auto';
    var newHeight = Math.max(el.scrollHeight, 42);
    el.style.height = newHeight + 'px';
  }

  function markDirty() {
    isDirty = true;
  }

  // ============ 复制按钮 ============
  document.querySelectorAll('.copy-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var field = btn.getAttribute('data-copy');
      var el = document.querySelector('.editable[data-field="' + field + '"]');
      var text = el ? el.textContent : '';
      if (!text) {
        showToast('内容为空');
        return;
      }
      copyText(text, function(ok) {
        showToast(ok ? '已复制' : '复制失败');
      });
    });
  });

  function copyText(text, cb) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() { cb(true); }).catch(function() { fallbackCopy(text, cb); });
    } else {
      fallbackCopy(text, cb);
    }
  }

  function fallbackCopy(text, cb) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      cb(ok);
    } catch (e) {
      cb(false);
    }
  }

  // ============ 保存当前编辑内容 ============
  function saveCurrent() {
    var item = {};
    document.querySelectorAll('.editable').forEach(function(el) {
      var field = el.getAttribute('data-field');
      item[field] = el.textContent;
    });

    // 标题为空：新建时不保存，编辑现有时保留原标题
    if (!item.title || !item.title.trim()) {
      return false;
    }

    if (currentEditId) {
      // 编辑现有
      for (var i = 0; i < data.length; i++) {
        if (String(data[i].id) === String(currentEditId)) {
          data[i] = Object.assign(data[i], item);
          break;
        }
      }
    } else {
      // 新建
      item.id = Date.now() + '' + Math.floor(Math.random() * 1000);
      item.createTime = Date.now();
      data.push(item);
      currentEditId = item.id;
    }

    saveData();
    return true;
  }

  // ============ 添加按钮 ============
  document.getElementById('fabAdd').addEventListener('click', function() {
    openEditor(null);
  });

  // ============ Android 返回键支持（可选） ============
  window.addEventListener('popstate', function() {
    if (editor.classList.contains('slide-in')) {
      closeEditor();
      history.pushState(null, '', location.href);
    }
  });

  // ============ 初始化 ============
  loadData();
  renderList();

  // 防止双击放大（iOS）
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });

})();
</script>

</body>
</html>
